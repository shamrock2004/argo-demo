apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: frontend-project
  namespace: argocd
spec:
  description: This project holds frontend App
  sourceRepos:
    - https://github.com/shamrock2004/argo-demo.git
  destinations:
    - namespace: default
    - server: https://172.31.15.92:33893
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  roles:
    - name: frontend-admin
      description: Admin for frontend team
      policies:
        - p,proj:frontend-proj:frontend-admin, applications, *, frontend-team/*, allow
